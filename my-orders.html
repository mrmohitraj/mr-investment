<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Orders | Mr Coin Wala</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div id="header-mount"></div>
<main class="page-enter">
  <div class="page-hero"><h1>📦 My Orders</h1><p>Track and review your past purchases</p></div>
  <div class="container" style="margin-top:0;">
    <div id="ordersList"></div>
  </div>
</main>

<!-- Review modal -->
<div id="reviewOverlay" class="filter-sheet-overlay"></div>
<div id="reviewModal" class="filter-sheet">
  <div class="d-flex justify-between align-center mb-16">
    <h3 style="margin:0;" id="reviewProductName">Rate Product</h3>
    <button id="closeReviewModal" class="btn btn-sm btn-outline">✕</button>
  </div>
  <div class="form-group">
    <label>Your Rating</label>
    <div id="starPicker" style="font-size:32px;letter-spacing:6px;cursor:pointer;">☆☆☆☆☆</div>
  </div>
  <div class="form-group">
    <label>Your Review (optional)</label>
    <textarea id="reviewText" class="form-control" rows="3" placeholder="How was the quality, delivery, packaging..."></textarea>
  </div>
  <button class="btn btn-primary btn-block" id="submitReviewBtn">Submit Review</button>
</div>

<div id="footer-mount"></div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/components.js"></script>
<script src="js/orders-page.js"></script>
</body>
</html>
