<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Buy Coins — Iron, Antique, Gifting Coins & More | Mr Coin Wala</title>
<meta name="description" content="Browse iron, antique, religious, gifting and custom coins directly from verified sellers at fair prices.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div id="header-mount"></div>

<main class="page-enter">
  <div class="page-hero">
    <h1>🪙 Buy Coins</h1>
    <p>Iron, antique, religious &amp; gifting coins from verified sellers</p>
  </div>

  <div class="content-card" style="margin-top:0;">
    <div class="header-search" style="height:44px;border:1px solid var(--border);margin-bottom:2px;">
      <span>🔍</span>
      <input type="text" id="pageSearchInput" placeholder="Search wheat, rice, onion, seller...">
      <button class="btn btn-sm btn-primary" id="pageSearchBtn">Go</button>
    </div>
  </div>

  <div class="chip-row" id="subCategoryChips" style="padding-top:0;"></div>

  <div class="d-flex justify-between align-center" style="padding:0 16px 6px;">
    <span class="text-muted" style="font-size:12.5px;" id="resultCount">Loading products...</span>
    <div class="d-flex gap-8">
      <select id="sortSelect" class="form-control" style="width:auto;padding:8px 10px;font-size:12px;">
        <option value="relevance">Relevance</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
        <option value="rating">Top Rated</option>
      </select>
      <button class="btn btn-sm btn-outline" id="filterBtn">⚙ Filter</button>
    </div>
  </div>

  <div class="product-grid" id="productGrid"></div>
</main>

<div class="filter-sheet-overlay" id="filterOverlay"></div>
<div class="filter-sheet" id="filterSheet">
  <div class="filter-sheet-handle"></div>
  <h3 style="margin:0 0 14px;">Filter Products</h3>
  <label style="font-size:13px;font-weight:700;">Max Price: <span id="priceRangeVal">Any price</span></label>
  <input type="range" id="priceRange" min="100" max="5000" step="50" value="5000" style="width:100%;margin:10px 0 20px;accent-color:var(--primary-green);">
  <div class="form-group">
    <label style="font-size:13px;font-weight:700;">District</label>
    <select id="districtSelect" class="form-control"><option value="">All Districts</option></select>
  </div>
  <div class="d-flex gap-8">
    <button class="btn btn-outline btn-block" id="clearFilterBtn">Clear</button>
    <button class="btn btn-primary btn-block" id="applyFilterBtn">Apply Filters</button>
  </div>
</div>

<div id="footer-mount"></div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/components.js"></script>
<script>window.PAGE_CATEGORY = 'crop';</script>
<script src="js/product-list.js"></script>
</body>
</html>
