<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Create Account | Mr Coin Wala</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div id="header-mount"></div>
<main class="page-enter">
  <div class="auth-wrap">
    <div class="auth-card scale-in">
      <h2>Create Account 🌱</h2>
      <p class="sub">Join thousands of sellers &amp; buyers across India</p>

      <label style="font-size:12.5px;font-weight:700;">I want to:</label>
      <div class="d-flex gap-8" style="margin:8px 0 16px;">
        <button type="button" class="filter-pill role-btn active" data-role="buyer" style="flex:1;">🧺 Buy</button>
        <button type="button" class="filter-pill role-btn" data-role="seller" style="flex:1;">🌾 Sell</button>
      </div>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" class="form-control" id="signupName" placeholder="Your full name">
          <div class="error-msg">Please enter your full name.</div>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" class="form-control" id="signupPhone" placeholder="10-digit mobile number" maxlength="10">
          <div class="error-msg">Enter a valid 10-digit phone number.</div>
        </div>
        <div class="form-group">
          <label>Email (optional)</label>
          <input type="email" class="form-control" id="signupEmail" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="signupPassword" placeholder="Create a password">
          <div class="error-msg">Password must be at least 4 characters.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
      <div class="auth-divider">OR</div>
      <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>
</main>
<div id="footer-mount"></div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/components.js"></script>
<script src="js/auth-page.js"></script>
</body>
</html>
