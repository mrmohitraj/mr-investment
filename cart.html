<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Cart | Mr Coin Wala</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<style>body{padding-bottom:90px;}</style>
</head>
<body>
<div id="header-mount"></div>
<main class="page-enter">
  <div class="page-hero"><h1>🛒 My Cart</h1><p>Review your items before checkout</p></div>
  <div class="content-card" style="margin-top:0;">
    <div id="cartList"></div>
  </div>
  <div class="container" id="cartSummary"></div>

  <!-- Order success confirmation (shown inline after checkout) -->
  <div class="container" id="orderSuccessView" style="display:none;text-align:center;padding:30px 16px;">
    <div style="font-size:64px;line-height:1;margin-bottom:10px;">✅</div>
    <h2 style="margin:0 0 6px;color:var(--dark-green);">Order Placed!</h2>
    <p class="text-muted" id="orderSuccessId" style="margin:0 0 18px;font-size:13px;"></p>
    <div class="content-card" style="text-align:left;margin:0 0 20px;">
      <div id="orderSuccessItems"></div>
      <div class="d-flex justify-between align-center" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);">
        <span class="text-muted" style="font-size:12px;" id="orderSuccessAddress"></span>
        <span style="font-weight:800;" id="orderSuccessTotal"></span>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="confirmWhatsAppBtn" style="margin-bottom:10px;">💬 Confirm Order via WhatsApp</button>
    <a href="my-orders.html" class="btn btn-outline btn-block">View My Orders</a>
  </div>
</main>
<div class="sticky-checkout" id="stickyCheckout" style="display:none;"></div>

<!-- Checkout / address modal -->
<div id="checkoutOverlay" class="filter-sheet-overlay"></div>
<div id="checkoutModal" class="filter-sheet">
  <div class="d-flex justify-between align-center mb-16">
    <h3 style="margin:0;">Delivery Details</h3>
    <button id="closeCheckoutModal" class="btn btn-sm btn-outline">✕</button>
  </div>

  <button type="button" id="useLocationBtn" class="btn btn-outline btn-block" style="margin-bottom:16px;color:var(--primary-green);border-color:var(--primary-green);">
    📍 Use my current location
  </button>
  <div id="locationStatus" class="text-muted" style="font-size:11.5px;margin:-10px 0 14px;display:none;"></div>

  <div class="form-group">
    <label>House / Flat No. &amp; Street *</label>
    <input type="text" id="addrHouse" class="form-control" placeholder="e.g. House No. 12, Near Shiv Mandir">
  </div>
  <div class="form-group">
    <label>Village / Area / Locality *</label>
    <input type="text" id="addrArea" class="form-control" placeholder="e.g. Ward 4, Kiul">
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>City / District *</label>
      <input type="text" id="addrCity" class="form-control" placeholder="e.g. Lakhisarai">
    </div>
    <div class="form-group">
      <label>State *</label>
      <input type="text" id="addrState" class="form-control" placeholder="e.g. Bihar">
    </div>
  </div>
  <div class="form-group">
    <label>PIN Code *</label>
    <input type="tel" id="addrPin" class="form-control" maxlength="6" placeholder="6-digit PIN, e.g. 811311">
  </div>
  <div class="form-group">
    <label>Your Full Name *</label>
    <input type="text" id="addrName" class="form-control" placeholder="Naam likhein">
  </div>
  <div class="form-group">
    <label>Mobile Number *</label>
    <input type="tel" id="addrPhone" class="form-control" maxlength="10" placeholder="10-digit mobile number">
  </div>

  <div id="addressWarn" class="text-muted" style="font-size:11.5px;margin:-6px 0 14px;color:var(--danger);display:none;"></div>
  <div id="bulkDiscountNote" class="text-muted" style="font-size:12px;margin-bottom:10px;"></div>
  <button class="btn btn-primary btn-block" id="confirmCheckoutBtn">Confirm &amp; Order via WhatsApp</button>
</div>

<div id="footer-mount"></div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/components.js"></script>
<script src="js/cart-page.js"></script>
</body>
</html>
