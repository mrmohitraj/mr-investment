<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin Panel | Mr Coin Wala</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div id="header-mount"></div>

<main class="page-enter">
  <div class="page-hero"><h1>🛠️ Admin Panel</h1><p>Manage every product listed on the site</p></div>

  <div class="container" style="margin-top:0;">

    <!-- Password gate -->
    <div id="adminLoginBox" class="content-card" style="max-width:360px;margin:0 auto;">
      <h3 style="margin-top:0;">Enter Admin Password</h3>
      <div class="form-group">
        <input type="password" id="adminPassword" class="form-control" placeholder="Password">
      </div>
      <button class="btn btn-primary btn-block" id="adminLoginBtn">Unlock</button>
      <p class="text-muted" style="font-size:11.5px;margin-top:10px;">
        Default password is <b>admin123</b>. You can change it by editing
        <code>js/admin-page.js</code> — search for <code>ADMIN_PASSWORD</code>.
      </p>
    </div>

    <!-- Admin content, hidden until unlocked -->
    <div id="adminPanel" style="display:none;">
      <div class="stat-grid mb-16">
        <div class="stat-card"><div class="stat-val" id="statTotalListings">0</div><div class="stat-lbl">Total Listings</div></div>
        <div class="stat-card"><div class="stat-val" id="statCropListings">0</div><div class="stat-lbl">Coins</div></div>
        <div class="stat-card"><div class="stat-val" id="statWasteListings">0</div><div class="stat-lbl">Bulk Coins</div></div>
        <div class="stat-card"><div class="stat-val" id="statSellers">0</div><div class="stat-lbl">Sellers</div></div>
        <div class="stat-card"><div class="stat-val" id="statTotalOrders">0</div><div class="stat-lbl">Total Orders</div></div>
        <div class="stat-card"><div class="stat-val" id="statRevenue">₹0</div><div class="stat-lbl">Total Revenue</div></div>
        <div class="stat-card"><div class="stat-val" id="statTopCrop" style="font-size:14px;">—</div><div class="stat-lbl">Top-Selling Item</div></div>
      </div>

      <div class="d-flex gap-8 mb-16">
        <button class="btn btn-sm btn-primary" id="tabListingsBtn">📦 Listings</button>
        <button class="btn btn-sm btn-outline" id="tabOrdersBtn">🧾 Orders</button>
      </div>

      <div id="listingsTab">
        <div class="content-card" style="margin:0 0 16px;">
          <input type="text" id="adminSearch" class="form-control" placeholder="🔍 Search by product name or seller...">
        </div>
        <div id="adminListings"></div>
      </div>

      <div id="ordersTab" style="display:none;">
        <div id="adminOrders"></div>
      </div>
    </div>
  </div>
</main>

<!-- Edit modal -->
<div id="editModalOverlay" class="filter-sheet-overlay"></div>
<div id="editModal" class="filter-sheet">
  <div class="d-flex justify-between align-center mb-16">
    <h3 style="margin:0;">Edit Product</h3>
    <button id="closeEditModal" class="btn btn-sm btn-outline">✕</button>
  </div>
  <div class="form-group"><label>Name</label><input type="text" id="editName" class="form-control"></div>
  <div class="form-group"><label>Price (₹)</label><input type="number" id="editPrice" class="form-control"></div>
  <div class="form-group"><label>Quantity Available</label><input type="number" id="editQty" class="form-control"></div>
  <div class="form-group"><label>Image URL</label><input type="text" id="editImage" class="form-control"></div>
  <div class="form-group"><label>Description</label><textarea id="editDescription" class="form-control" rows="3"></textarea></div>
  <button class="btn btn-primary btn-block" id="saveEditBtn">Save Changes</button>
</div>

<div id="footer-mount"></div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/components.js"></script>
<script src="js/admin-page.js"></script>
</body>
</html>
