<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Login | Mr Coin Wala</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div id="header-mount"></div>
<main class="page-enter">
  <div class="auth-wrap">
    <div class="auth-card scale-in">
      <h2>Welcome Back 👋</h2>
      <p class="sub">Login to buy and sell coins on Mr Coin Wala</p>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" class="form-control" id="loginPhone" placeholder="10-digit mobile number" maxlength="10">
          <div class="error-msg">Enter a valid 10-digit phone number.</div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password">
          <div class="error-msg">Password must be at least 4 characters.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
      <div class="auth-divider">OR</div>
      <p class="auth-switch">New to Mr Coin Wala? <a href="signup.html">Create an account</a></p>
    </div>
  </div>
</main>
<div id="footer-mount"></div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/components.js"></script>
<script src="js/auth-page.js"></script>
</body>
</html>
